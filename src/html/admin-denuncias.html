<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Admin | Denúncias</title>

 <link rel="stylesheet" href="/css/admin-denuncias.css">

  <link rel="stylesheet" href="../css/admin-coletas.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>

<body>

<a href="/admin" class="btn-voltar-admin">
  ← Voltar ao painel
</a>

<h2>Administração de Denúncias</h2>
<div class="filtro-container">
  <label>Filtrar denúncias</label>

  <div class="filtro-select">
    <span class="icone"></span>
    <select id="filtroCategoria" onchange="filtrarDenuncias()">
      <option value="">Todas as categorias</option>
      <option value="spam">Spam</option>
      <option value="ofensivo">Ofensivo</option>
      <option value="fake">Informação falsa</option>
      <option value="ilegal">Conteúdo ilegal</option>
    </select>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Usuário</th>
      <th>Motivo</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody id="listaDenuncias">
    <tr>
      <td colspan="5">Carregando...</td>
    </tr>
  </tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/admin-denuncias.js"></script>

</body>
</html>
